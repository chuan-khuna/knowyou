[tools]
bun = "1.4.4"
just = "1.59"
node = "26"
uv = "0.13"

[tasks.skills]
description = "Install the vendored agent skills"
run = [
  "bunx skills add mattpocock/skills#v1.3.2",
  "bunx skills add thananon/9arm-skills --skill debug-mantra --skill scrutinize --skill post-mortem --skill management-talk",
  "bunx skills add cursor/plugins --skill unslop --skill technical-writing",
  "bunx skills add nutlope/hallmark",
]

[tasks.plugins]
description = "Install the local altr-skills plugin (altr-stack marketplace)"
run = [
  "claude plugin marketplace add chuan-khuna/altr-stack --scope project",
  "claude plugin install altr-skills@altr-stack --scope project",
  "claude plugin update altr-skills@altr-stack --scope project",
]
